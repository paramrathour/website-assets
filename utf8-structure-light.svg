<g><text x="86.1" y="112.2" font-size="14" fill="#1a1a1a" text-anchor="middle">0</text><text x="168.0" y="50.0" font-size="16" font-weight="bold" fill="#1a1a1a">1-byte codeword</text><text x="168.0" y="71.0" font-size="14" fill="#b03a2e" font-family='Consolas,Menlo,monospace'>0xxxxxxx</text><text x="168.0" y="90.0" font-size="12.5" fill="#2a6f97" font-style="italic">Encodes U+0000 to U+007F using 1 byte (ASCII)</text><text x="84.1" y="226.0" font-size="14" fill="#1a1a1a" text-anchor="middle">1</text><text x="210.0" y="218.8" font-size="14" fill="#1a1a1a" text-anchor="middle">0</text><text x="286.0" y="158.0" font-size="16" font-weight="bold" fill="#1a1a1a">Continuation byte (non-lead)</text><text x="286.0" y="179.0" font-size="14" fill="#b03a2e" font-family='Consolas,Menlo,monospace'>10xxxxxx</text><text x="286.0" y="198.0" font-size="12.5" fill="#2a6f97" font-style="italic">Every byte after the lead byte in the 2/3/4-byte character rows below has this form</text><text x="207.9" y="328.6" font-size="14" fill="#1a1a1a" text-anchor="middle">1</text><text x="328.1" y="323.1" font-size="14" fill="#1a1a1a" text-anchor="middle">0</text><text x="404.0" y="266.0" font-size="16" font-weight="bold" fill="#1a1a1a">First byte of a 2-byte character</text><text x="404.0" y="287.0" font-size="14" fill="#b03a2e" font-family='Consolas,Menlo,monospace'>110xxxyy 10yyzzzz</text><text x="404.0" y="306.0" font-size="12.5" fill="#2a6f97" font-style="italic">Encodes U+0080 to U+07FF using 2 bytes</text><text x="326.0" y="426.7" font-size="14" fill="#1a1a1a" text-anchor="middle">1</text><text x="446.4" y="423.8" font-size="14" fill="#1a1a1a" text-anchor="middle">0</text><text x="522.0" y="374.0" font-size="16" font-weight="bold" fill="#1a1a1a">First byte of a 3-byte character</text><text x="522.0" y="395.0" font-size="14" fill="#b03a2e" font-family='Consolas,Menlo,monospace'>1110wwww 10xxxxyy 10yyzzzz</text><text x="522.0" y="414.0" font-size="12.5" fill="#2a6f97" font-style="italic">Encodes U+0800 to U+FFFF using 3 bytes</text><text x="444.4" y="515.0" font-size="14" fill="#1a1a1a" text-anchor="middle">1</text><text x="565.6" y="516.8" font-size="14" fill="#1a1a1a" text-anchor="middle">0</text><text x="640.0" y="482.0" font-size="16" font-weight="bold" fill="#1a1a1a">First byte of a 4-byte character</text><text x="640.0" y="503.0" font-size="14" fill="#b03a2e" font-family='Consolas,Menlo,monospace'>11110uvv 10vvwwww 10xxxxyy 10yyzzzz</text><text x="640.0" y="522.0" font-size="12.5" fill="#2a6f97" font-style="italic">Encodes U+010000 to U+10FFFF using 4 bytes</text><text x="565.6" y="584.2" font-size="14" fill="#1a1a1a" text-anchor="middle">1</text><text x="640.0" y="590.0" font-size="16" font-weight="bold" fill="#1a1a1a">Unused</text><text x="640.0" y="611.0" font-size="14" fill="#b03a2e" font-family='Consolas,Menlo,monospace'>11111xxx</text><text x="640.0" y="630.0" font-size="12.5" fill="#2a6f97" font-style="italic">Not a valid UTF-8 lead byte</text></g>
