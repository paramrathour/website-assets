<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="-48 -30 360 270">
 <title>Huffman coding visualisation</title>
 <desc>Visualisation of the use of Huffman coding to encode the message "A_DEAD_DAD_CEDED_A_BAD_BABE_A_BEADED_ABACA_BED" by CMG Lee. In steps 2 to 6, the letters are sorted by increasing frequency, and the least frequent two at each step are combined and reinserted into the list, and a partial tree is constructed. The final tree in step 6 is traversed to generate the dictionary in step 7. Step 8 uses it to encode the message.</desc>
 <defs>
  <text id="0" x="0" y="0.7ex"><tspan font-size="6" fill="#e8e8e8">0</tspan
   ><tspan dx="1" dy="1" fill="#b0b0b0">/</tspan></text>
  <text id="1" x="0" y="0.7ex"><tspan dy="1" fill="#b0b0b0">\</tspan
   ><tspan dy="-2" font-size="6" font-weight="bold" fill="#d6d6d6">1</tspan></text>
  <text id="_" x="0" y="0.7ex" fill="#6699ff"><tspan font-weight="bold">_</tspan><tspan fill="#b0b0b0">:10</tspan></text>
  <text id="d" x="0" y="0.7ex" fill="#0066ff"><tspan font-weight="bold">D</tspan><tspan fill="#b0b0b0">:10</tspan></text>
  <text id="a" x="0" y="0.7ex" fill="#33cc66"><tspan font-weight="bold">A</tspan><tspan fill="#b0b0b0">:11</tspan></text>
  <text id="e" x="0" y="0.7ex" fill="#e6b84a"><tspan font-weight="bold">E</tspan><tspan fill="#b0b0b0">:&#8199;7</tspan></text>
  <text id="c" x="0" y="0.7ex" fill="#ff5c5c"><tspan font-weight="bold">C</tspan><tspan fill="#b0b0b0">:&#8199;2</tspan></text>
  <text id="b" x="0" y="0.7ex" fill="#e05cff"><tspan font-weight="bold">B</tspan><tspan fill="#b0b0b0">:&#8199;6</tspan></text>
  <text id="cb"     x="0" y="0.7ex" fill="#ff66ff"><tspan>CB</tspan    ><tspan fill="#b0b0b0">:&#8199;8</tspan></text>
  <text id="ecb"    x="0" y="0.7ex" fill="#ffad4d"><tspan>ECB</tspan   ><tspan fill="#b0b0b0">:15</tspan></text>
  <text id="aecb"   x="0" y="0.7ex" fill="#cccc4d"><tspan>AECB</tspan  ><tspan fill="#b0b0b0">:26</tspan></text>
  <text id="_daecb" x="0" y="0.7ex" fill="#33dd66"><tspan>_DAECB</tspan><tspan fill="#b0b0b0">:46</tspan></text>
  <text id="_d"     x="0" y="0.7ex" fill="#4d7cff"><tspan>_D</tspan    ><tspan fill="#b0b0b0">:20</tspan></text>
  <path id="arrowhead" d="M 2,-1 l -2,1 l 2,1"/>
  <g id="bracket">
   <path d="M -25,-2 h -15 m -8,-8 c 8,0 -2,8 6,8 c -8,0 2,8 -6,8"/>
   <use xlink:href="#arrowhead" transform="translate(-25,-2) rotate(180)"/>
  </g>
  <g id="tree_cb">
   <use xlink:href="#cb"/>
   <use xlink:href="#0" transform="translate(-15,10)"/>
   <use xlink:href="#1" transform="translate(  5,10)"/>
   <use xlink:href="#c" transform="translate(-15,20)"/>
   <use xlink:href="#b" transform="translate( 15,20)"/>
  </g>
  <g id="tree_ecb">
   <use xlink:href="#ecb"/>
   <use xlink:href="#0"       transform="translate(-15,10)"/>
   <use xlink:href="#1"       transform="translate(  5,10)"/>
   <use xlink:href="#e"       transform="translate(-15,20)"/>
   <use xlink:href="#tree_cb" transform="translate( 15,20)"/>
  </g>
  <g id="tree_aecb">
   <use xlink:href="#aecb"/>
   <use xlink:href="#0"        transform="translate(-15,10)"/>
   <use xlink:href="#1"        transform="translate(  5,10)"/>
   <use xlink:href="#a"        transform="translate(-15,20)"/>
   <use xlink:href="#tree_ecb" transform="translate( 20,20)"/>
  </g>
  <g id="tree__daecb">
   <use xlink:href="#_daecb"/>
   <use xlink:href="#0"         transform="translate(-25,10)"/>
   <use xlink:href="#1"         transform="translate( 20,10)"/>
   <use xlink:href="#tree__d"   transform="translate(-30,20)"/>
   <use xlink:href="#tree_aecb" transform="translate( 30,20)"/>
  </g>
  <g id="tree__d">
   <use xlink:href="#_d"/>
   <use xlink:href="#0" transform="translate(-10,10)"/>
   <use xlink:href="#1" transform="translate( 10,10)"/>
   <use xlink:href="#_" transform="translate(-15,20)"/>
   <use xlink:href="#d" transform="translate( 15,20)"/>
  </g>
 </defs>
 <g font-family="Helvetica,Arial,sans-serif" font-size="9" text-anchor="middle"
    stroke-width="0.5" stroke="none" fill="#e8e8e8">
  <g transform="translate(0,-20)">
   <text x="-40" y="0.7ex" font-weight="bold">1.</text>
   <text x="-30" y="0.7ex" font-weight="bold" text-anchor="start"><tspan>"</tspan
    ><tspan fill="#33cc66">A</tspan><tspan fill="#6699ff">_</tspan
    ><tspan fill="#0066ff">D</tspan><tspan fill="#e6b84a">E</tspan
    ><tspan fill="#33cc66">A</tspan><tspan fill="#0066ff">D</tspan
    ><tspan fill="#6699ff">_</tspan><tspan fill="#0066ff">D</tspan
    ><tspan fill="#33cc66">A</tspan><tspan fill="#0066ff">D</tspan
    ><tspan fill="#6699ff">_</tspan><tspan fill="#ff5c5c">C</tspan
    ><tspan fill="#e6b84a">E</tspan><tspan fill="#0066ff">D</tspan
    ><tspan fill="#e6b84a">E</tspan><tspan fill="#0066ff">D</tspan
    ><tspan fill="#6699ff">_</tspan><tspan fill="#33cc66">A</tspan
    ><tspan fill="#6699ff">_</tspan><tspan fill="#e05cff">B</tspan
    ><tspan fill="#33cc66">A</tspan><tspan fill="#0066ff">D</tspan
    ><tspan fill="#6699ff">_</tspan><tspan fill="#e05cff">B</tspan
    ><tspan fill="#33cc66">A</tspan><tspan fill="#e05cff">B</tspan
    ><tspan fill="#e6b84a">E</tspan><tspan fill="#6699ff">_</tspan
    ><tspan fill="#33cc66">A</tspan><tspan fill="#6699ff">_</tspan
    ><tspan fill="#e05cff">B</tspan><tspan fill="#e6b84a">E</tspan
    ><tspan fill="#33cc66">A</tspan><tspan fill="#0066ff">D</tspan
    ><tspan fill="#e6b84a">E</tspan><tspan fill="#0066ff">D</tspan
    ><tspan fill="#6699ff">_</tspan><tspan fill="#33cc66">A</tspan
    ><tspan fill="#e05cff">B</tspan><tspan fill="#33cc66">A</tspan
    ><tspan fill="#ff5c5c">C</tspan><tspan fill="#33cc66">A</tspan
    ><tspan fill="#6699ff">_</tspan><tspan fill="#e05cff">B</tspan
    ><tspan fill="#e6b84a">E</tspan><tspan fill="#0066ff">D</tspan
    ><tspan>"</tspan></text>
  </g>
  <g transform="translate(0,0)">
   <text x="-40" y="0.7ex" font-weight="bold">2.</text>
   <g text-anchor="end">
    <use xlink:href="#c" transform="translate(0,0)"/>
    <use xlink:href="#b" transform="translate(0,10)"/>
    <use xlink:href="#e" transform="translate(0,20)"/>
    <use xlink:href="#_" transform="translate(0,30)"/>
    <use xlink:href="#d" transform="translate(0,40)"/>
    <use xlink:href="#a" transform="translate(0,50)"/>
   </g>
   <g transform="translate(50,7)" stroke="#b0b0b0" fill="none">
    <use xlink:href="#bracket"/>
    <use xlink:href="#tree_cb" stroke="none"/>
    <use xlink:href="#arrowhead" transform="translate(-48,17)"/>
    <path d="M -25,2 c -25,0 0,15 -22,15"/>
   </g>
  </g>
  <g transform="translate(0,80)">
   <text x="-40" y="0.7ex" font-weight="bold">3.</text>
   <g text-anchor="end">
    <use xlink:href="#e"  transform="translate(0,0)"/>
    <use xlink:href="#cb" transform="translate(0,10)"/>
    <use xlink:href="#_"  transform="translate(0,20)"/>
    <use xlink:href="#d"  transform="translate(0,30)"/>
    <use xlink:href="#a"  transform="translate(0,40)"/>
   </g>
   <g transform="translate(50,7)" stroke="#b0b0b0" fill="none">
    <use xlink:href="#bracket"/>
    <use xlink:href="#tree_ecb" stroke="none"/>
    <use xlink:href="#arrowhead" transform="translate(-48,37)"/>
    <path d="M -25,2 c -25,0 0,35 -22,35"/>
   </g>
  </g>
  <g transform="translate(0,150)">
   <text x="-40" y="0.7ex" font-weight="bold">4.</text>
   <g text-anchor="end">
    <use xlink:href="#_"   transform="translate(0,0)"/>
    <use xlink:href="#d"   transform="translate(0,10)"/>
    <use xlink:href="#a"   transform="translate(0,20)"/>
    <use xlink:href="#ecb" transform="translate(0,30)"/>
   </g>
   <g transform="translate(50,7)" stroke="#b0b0b0" fill="none">
    <use xlink:href="#bracket"/>
    <use xlink:href="#tree__d" stroke="none"/>
    <use xlink:href="#arrowhead" transform="translate(-48,27)"/>
    <path d="M -25,2 c -25,0 0,25 -22,25"/>
   </g>
  </g>
  <g transform="translate(170,0)">
   <text x="-45" y="0.7ex" font-weight="bold">5.</text>
   <g text-anchor="end">
    <use xlink:href="#a"   transform="translate(0,0)"/>
    <use xlink:href="#ecb" transform="translate(0,10)"/>
    <use xlink:href="#_d"  transform="translate(0,20)"/>
   </g>
   <g transform="translate(50,7)" stroke="#b0b0b0" fill="none">
    <use xlink:href="#bracket"/>
    <use xlink:href="#tree_aecb" stroke="none"/>
    <use xlink:href="#arrowhead" transform="translate(-48,17)"/>
    <path d="M -25,2 c -25,0 0,15 -22,15"/>
   </g>
  </g>
  <g transform="translate(170,80)">
   <text x="-45" y="0.7ex" font-weight="bold">6.</text>
   <g text-anchor="end">
    <use xlink:href="#_d"   transform="translate(0,0)"/>
    <use xlink:href="#aecb" transform="translate(0,10)"/>
   </g>
   <g transform="translate(50,7)" stroke="#b0b0b0" fill="none">
    <use xlink:href="#bracket"/>
    <use xlink:href="#tree__daecb" stroke="none"/>
   </g>
  </g>
  <g transform="translate(170,150)">
   <text x="-45" y="0.7ex" font-weight="bold">7.</text>
   <g text-anchor="middle" font-weight="bold">
    <text x="-30" y="0"  dy="0.7ex" fill="#6699ff">_</text>
    <text x="-30" y="10" dy="0.7ex" fill="#0066ff">D</text>
    <text x="-30" y="20" dy="0.7ex" fill="#33cc66">A</text>
    <text x="-30" y="30" dy="0.7ex" fill="#e6b84a">E</text>
    <text x="-30" y="40" dy="0.7ex" fill="#ff5c5c">C</text>
    <text x="-30" y="50" dy="0.7ex" fill="#e05cff">B</text>
   </g>
   <g text-anchor="start">
    <text x="-25" y="0"  dy="0.7ex" fill="#6699ff">:&#8199;00</text>
    <text x="-25" y="10" dy="0.7ex" fill="#0066ff">:&#8199;01</text>
    <text x="-25" y="20" dy="0.7ex" fill="#33cc66">:&#8199;10</text>
    <text x="-25" y="30" dy="0.7ex" fill="#e6b84a">:&#8199;110</text>
    <text x="-25" y="40" dy="0.7ex" fill="#ff5c5c">:&#8199;1110</text>
    <text x="-25" y="50" dy="0.7ex" fill="#e05cff">:&#8199;1111</text>
   </g>
  </g>
  <g transform="translate(0,220)">
   <text x="-40" y="0.7ex" font-weight="bold">8.</text>
   <text x="-30" y="0.7ex" text-anchor="start"><tspan>"</tspan
    ><tspan fill="#33cc66">10</tspan><tspan fill="#6699ff">00</tspan
    ><tspan fill="#0066ff">01</tspan><tspan fill="#e6b84a">110</tspan
    ><tspan fill="#33cc66">10</tspan><tspan fill="#0066ff">01</tspan
    ><tspan fill="#6699ff">00</tspan><tspan fill="#0066ff">01</tspan
    ><tspan fill="#33cc66">10</tspan><tspan fill="#0066ff">01</tspan
    ><tspan fill="#6699ff">00</tspan><tspan fill="#ff5c5c">1110</tspan
    ><tspan fill="#e6b84a">110</tspan><tspan fill="#0066ff">01</tspan
    ><tspan fill="#e6b84a">110</tspan><tspan fill="#0066ff">01</tspan
    ><tspan fill="#6699ff">00</tspan><tspan fill="#33cc66">10</tspan
    ><tspan fill="#6699ff">00</tspan><tspan fill="#e05cff">1111</tspan
    ><tspan fill="#33cc66">10</tspan><tspan fill="#0066ff">01</tspan
    ><tspan fill="#6699ff">00</tspan><tspan fill="#e05cff">1111</tspan
    ><tspan fill="#33cc66">10</tspan><tspan fill="#e05cff">1111</tspan
    ><tspan fill="#e6b84a">110</tspan><tspan x="-25" dy="1em" fill="#6699ff">00</tspan
    ><tspan fill="#33cc66">10</tspan><tspan fill="#6699ff">00</tspan
    ><tspan fill="#e05cff">1111</tspan><tspan fill="#e6b84a">110</tspan
    ><tspan fill="#33cc66">10</tspan><tspan fill="#0066ff">01</tspan
    ><tspan fill="#e6b84a">110</tspan><tspan fill="#0066ff">01</tspan
    ><tspan fill="#6699ff">00</tspan><tspan fill="#33cc66">10</tspan
    ><tspan fill="#e05cff">1111</tspan><tspan fill="#33cc66">10</tspan
    ><tspan fill="#ff5c5c">1110</tspan><tspan fill="#33cc66">10</tspan
    ><tspan fill="#6699ff">00</tspan><tspan fill="#e05cff">1111</tspan
    ><tspan fill="#e6b84a">110</tspan><tspan fill="#0066ff">01</tspan
    ><tspan>"</tspan></text>
  </g>
 </g>
</svg>
